[project]
name = "ledgersense"
version = "0.1.0"
description = "Autonomous audit and Indian tax-compliance copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlmodel",
    "openai",
    "pyyaml",
    "python-multipart",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgersense"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
